<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>BT04 - Form</title>
    <style>
      body {
        font-family: Arial;
        background: #f3f3f3;
      }
      .wrap {
        width: 760px;
        margin: 20px auto;
        background: #fff;
        padding: 18px 20px;
        border: 1px solid #ccc;
      }
      h3 {
        margin: 10px 0;
        padding: 8px 0;
        border-bottom: 1px solid #ddd;
      }
      .row {
        display: flex;
        gap: 12px;
        margin: 10px 0;
        align-items: center;
      }
      .row label {
        width: 160px;
        font-weight: 600;
      }
      .row input[type="text"],
      .row input[type="date"],
      .row select {
        flex: 1;
        padding: 7px 8px;
        border: 1px solid #bbb;
        border-radius: 4px;
      }
      textarea {
        width: 100%;
        height: 140px;
        padding: 8px;
        border: 1px solid #bbb;
        border-radius: 4px;
      }
      .btns {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      button {
        padding: 8px 14px;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .submit {
        background: #2b7cff;
        color: #fff;
      }
      .cancel {
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <form class="wrap">
      <h3>Basic Info</h3>

      <div class="row">
        <label>Employee ID</label>
        <div class="control">
          <div style="font-size: 20px">9</div>
        </div>
      </div>
      <div class="row">
        <label>Last Name</label>
        <div class="control">
          <div style="font-size: 20px">Dodsworth</div>
        </div>
      </div>
      <div class="row">
        <label>First Name</label><input type="text" value="Anne" />
      </div>

      <div class="row">
        <label>Gender</label>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label><input type="radio" name="gender" /> Male</label>
          <label><input type="radio" name="gender" checked /> Female</label>
          <label><input type="radio" name="gender" /> XXX</label>
          <label><input type="radio" name="gender" /> ZZZ</label>
        </div>
      </div>

      <div class="row">
        <label>Title</label><input type="text" value="Sales Representative" />
      </div>
      <div class="row">
        <label>Suffix</label><input type="text" value="Ms." />
      </div>
      <div class="row">
        <label>BirthDate</label><input type="date" value="1969-07-02" />
      </div>
      <div class="row">
        <label>HireDate</label><input type="date" value="1994-11-15" />
      </div>

      <div class="row">
        <label>SSN # (if applicable)</label><input type="text" />
      </div>

      <div class="row">
        <label>Reports To</label>
        <select>
          <option>— Select —</option>
          <option selected>Buchanan</option>
          <option>Fuller</option>
          <option>Leverling</option>
        </select>
      </div>

      <h3>Contact Info</h3>
      <div class="row">
        <label>Email</label><input type="text" placeholder="name@example.com" />
      </div>
      <div class="row">
        <label>Address</label><input type="text" value="7 Houndstooth Rd." />
      </div>
      <div class="row">
        <label>City</label><input type="text" value="London" />
      </div>
      <div class="row"><label>Region</label><input type="text" /></div>
      <div class="row">
        <label>Postal Code</label><input type="text" value="WG2 7LT" />
      </div>
      <div class="row">
        <label>Country</label>
        <select>
          <option selected>Russian Federation</option>
          <option>Viet Nam</option>
          <option>United Kingdom</option>
        </select>
      </div>

      <h3>Optional Info</h3>

      <div class="row" style="display: flex; align-items: center; gap: 12px">
        <label style="min-width: 80px">Notes</label>
        <textarea rows="4" cols="50">
Anne has a BA degree in English...</textarea
        >
      </div>

      <div class="row">
        <label>Preferred Shift</label>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label><input type="checkbox" /> Regular</label>
          <label><input type="checkbox" checked /> Gravy Yard</label>
        </div>
      </div>

      <div class="row">
        <label>Active?</label>
        <input type="checkbox" checked />
      </div>

      <div class="btns">
        <button type="button" class="cancel">Cancel</button>
        <button type="submit" class="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
