<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Form đặt hàng</title>
<link rel="stylesheet" href="style44.css">
</head>

<body>

<h2>Đặt hàng online</h2>

<form id="orderForm">

<div class="form-group">
<label>Tên sản phẩm</label>
<select id="product">
<option value="">-- Chọn sản phẩm --</option>
<option value="Áo">Áo</option>
<option value="Quần">Quần</option>
<option value="Giày">Giày</option>
<option value="Mũ">Mũ</option>
</select>
<small class="error" id="productError"></small>
</div>

<div class="form-group">
<label>Số lượng</label>
<input type="number" id="quantity">
<small class="error" id="quantityError"></small>
</div>

<div class="form-group">
<label>Ngày giao hàng</label>
<input type="date" id="deliveryDate">
<small class="error" id="dateError"></small>
</div>

<div class="form-group">
<label>Địa chỉ giao</label>
<input type="text" id="address">
<small class="error" id="addressError"></small>
</div>

<div class="form-group">
<label>Ghi chú</label>
<textarea id="note"></textarea>
<div class="char-count" id="charCount">0/200</div>
<small class="error" id="noteError"></small>
</div>

<div class="form-group">
<label>Phương thức thanh toán</label>

<label><input type="radio" name="payment" value="COD"> COD</label>
<label><input type="radio" name="payment" value="Chuyển khoản"> Chuyển khoản</label>
<label><input type="radio" name="payment" value="Ví điện tử"> Ví điện tử</label>

<small class="error" id="paymentError"></small>
</div>

<div class="total">
Tổng tiền: <span id="totalPrice">0</span> VNĐ
</div>

<button type="submit">Đặt hàng</button>

</form>

<div id="confirmBox" class="confirm-box">

<h3>Xác nhận đơn hàng</h3>

<p id="orderSummary"></p>

<button id="confirmBtn">Xác nhận</button>
<button id="cancelBtn">Hủy</button>

</div>

<div id="success"></div>

<script src="main44.js"></script>

</body>
</html>
