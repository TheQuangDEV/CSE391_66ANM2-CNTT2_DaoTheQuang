<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="style46.css" />
  </head>

  <body>
    <h2>Đăng ký tài khoản</h2>

    <form id="registerForm">
      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="fullname" maxlength="50" />
        <div class="char-count" id="nameCount">0/50</div>
        <small class="error" id="fullnameError"></small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="text" id="email" />
        <small class="error" id="emailError"></small>
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="text" id="phone" />
        <small class="error" id="phoneError"></small>
      </div>

      <div class="form-group password-box">
        <label>Mật khẩu</label>

        <div class="password-wrapper">
          <input type="password" id="password" />
          <span id="togglePassword">👁</span>
        </div>

        <div class="strength-bar">
          <div id="strength"></div>
        </div>

        <div id="strengthText"></div>

        <small class="error" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label>Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" />
        <small class="error" id="confirmPasswordError"></small>
      </div>

      <div class="form-group">
        <label>Giới tính</label>
        <label><input type="radio" name="gender" value="Nam" /> Nam</label>
        <label><input type="radio" name="gender" value="Nữ" /> Nữ</label>
        <small class="error" id="genderError"></small>
      </div>

      <div class="form-group">
        <label> <input type="checkbox" id="terms" /> Đồng ý điều khoản </label>
        <small class="error" id="termsError"></small>
      </div>

      <button type="submit">Đăng ký</button>
    </form>

    <div id="successMessage"></div>

    <script src="main46.js"></script>
  </body>
</html>
